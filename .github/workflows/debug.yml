name: Debug build

# Runs only when started manually from the Actions tab.
# There are no push or pull request triggers, so nothing is built or uploaded automatically.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to build"
        type: choice
        default: mobile
        options:
          - mobile
          - tv
          - both
      retention_days:
        description: "How many days to keep the artifact (1-90)"
        type: string
        default: "30"

permissions:
  contents: read

concurrency:
  group: debug-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build mobile debug APK
        if: ${{ inputs.target == 'mobile' || inputs.target == 'both' }}
        run: ./gradlew :app-mobile:assembleAppDebug --stacktrace

      - name: Build TV debug APK
        if: ${{ inputs.target == 'tv' || inputs.target == 'both' }}
        run: ./gradlew :app-tv:assembleAppDebug --stacktrace

      - name: Upload mobile APK
        if: ${{ inputs.target == 'mobile' || inputs.target == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: anilibria-mobile-debug
          path: app-mobile/build/outputs/apk/app/debug/*.apk
          if-no-files-found: error
          retention-days: ${{ fromJSON(inputs.retention_days) }}

      - name: Upload TV APK
        if: ${{ inputs.target == 'tv' || inputs.target == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: anilibria-tv-debug
          path: app-tv/build/outputs/apk/app/debug/*.apk
          if-no-files-found: error
          retention-days: ${{ fromJSON(inputs.retention_days) }}
